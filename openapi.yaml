openapi: 3.1.0
info:
  title: User Service
  description: 'REST API для управления пользователями.


    Данные хранятся в памяти процесса и сбрасываются при перезапуске.'
  contact:
    name: Black-Box
    url: https://github.com/Georgy-collab/Black-Box
  version: 1.0.0
paths:
  /health:
    get:
      tags:
      - health
      summary: Проверка работоспособности
      description: Возвращает статус сервиса.
      operationId: health_health_get
      responses:
        '200':
          description: Сервис доступен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /users:
    post:
      tags:
      - users
      summary: Создать пользователя
      description: Создаёт нового пользователя. Email должен быть уникальным.
      operationId: create_user_users_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Пользователь создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Email уже занят или некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных данных
    get:
      tags:
      - users
      summary: Список пользователей
      description: Возвращает всех пользователей. Можно отфильтровать по минимальному
        возрасту.
      operationId: list_users_users_get
      parameters:
      - name: min_age
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: Минимальный возраст для фильтрации
          examples:
          - 18
          title: Min Age
        description: Минимальный возраст для фильтрации
      responses:
        '200':
          description: Список пользователей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/UserResponse'
                title: Response List Users Users Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /users/{user_id}:
    get:
      tags:
      - users
      summary: Получить пользователя
      description: Возвращает пользователя по идентификатору.
      operationId: get_user_users__user_id__get
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Идентификатор пользователя
          examples:
          - 1
          title: User Id
        description: Идентификатор пользователя
      responses:
        '200':
          description: Пользователь найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - users
      summary: Обновить пользователя
      description: Частично обновляет данные пользователя. Можно передать любые поля.
      operationId: update_user_users__user_id__put
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Идентификатор пользователя
          examples:
          - 1
          title: User Id
        description: Идентификатор пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: Пользователь обновлён
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Email уже занят или некорректные данные
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Ошибка валидации входных данных
    delete:
      tags:
      - users
      summary: Удалить пользователя
      description: Удаляет пользователя по идентификатору.
      operationId: delete_user_users__user_id__delete
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
          description: Идентификатор пользователя
          examples:
          - 1
          title: User Id
        description: Идентификатор пользователя
      responses:
        '204':
          description: Пользователь удалён
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ErrorResponse:
      properties:
        detail:
          type: string
          title: Detail
          description: Описание ошибки
          examples:
          - User not found
      type: object
      required:
      - detail
      title: ErrorResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: Статус сервиса
          examples:
          - ok
      type: object
      required:
      - status
      title: HealthResponse
    UserCreate:
      properties:
        name:
          type: string
          maxLength: 100
          minLength: 1
          title: Name
          description: Имя пользователя
          examples:
          - Alice
        email:
          type: string
          title: Email
          description: Email пользователя (уникальный)
          examples:
          - alice@example.com
        age:
          type: integer
          maximum: 149.0
          minimum: 1.0
          title: Age
          description: Возраст пользователя
          examples:
          - 25
      type: object
      required:
      - name
      - email
      - age
      title: UserCreate
    UserResponse:
      properties:
        id:
          type: integer
          title: Id
          description: Идентификатор пользователя
          examples:
          - 1
        name:
          type: string
          title: Name
          description: Имя пользователя
          examples:
          - Alice
        email:
          type: string
          title: Email
          description: Email пользователя
          examples:
          - alice@example.com
        age:
          type: integer
          title: Age
          description: Возраст пользователя
          examples:
          - 25
      type: object
      required:
      - id
      - name
      - email
      - age
      title: UserResponse
    UserUpdate:
      properties:
        name:
          anyOf:
          - type: string
            maxLength: 100
            minLength: 1
          - type: 'null'
          title: Name
          description: Новое имя пользователя
          examples:
          - Alicia
        email:
          anyOf:
          - type: string
          - type: 'null'
          title: Email
          description: Новый email пользователя
          examples:
          - alicia@example.com
        age:
          anyOf:
          - type: integer
            maximum: 149.0
            minimum: 1.0
          - type: 'null'
          title: Age
          description: Новый возраст пользователя
          examples:
          - 26
      type: object
      title: UserUpdate
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
tags:
- name: health
  description: Проверка состояния сервиса.
- name: users
  description: CRUD-операции с пользователями.
